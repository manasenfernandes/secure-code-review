rules:
  - id: weak-hash-md5
    languages:
      - python
    severity: WARNING
    message: MD5 is a weak hashing algorithm.
    pattern: hashlib.md5(...)

  - id: weak-hash-sha1
    languages:
      - python
    severity: WARNING
    message: SHA-1 is weak for security-sensitive hashing.
    pattern: hashlib.sha1(...)
