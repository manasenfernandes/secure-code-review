name: Security Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  semgrep:
    name: Semgrep (OWASP + custom rules)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Semgrep
        run: semgrep scan --config p/owasp-top-ten --config rules/ --exclude sample-app/app.py --error

  bandit:
    name: Bandit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r sample-app -x sample-app/app.py -ll

  gitleaks:
    name: Gitleaks (Secret Detection)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm \
            -v "$PWD:/src" \
            owasp/dependency-check:13.0.0 \
            --project "Secure Code Review" \
            --scan /src/sample-app \
            --nvdApiKey "$NVD_API_KEY" \
            --nvdApiDelay 5000 \
            --nvdMaxRetryCount 10 \
            --enableExperimental \
            --format HTML \
            --out /src/reports

      - name: Upload Dependency-Check Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: error       
